name: CI

on:
  push:
    branches: [main, integration/feature-merging]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r sprint1_v2/backend/requirements.txt ruff
      - name: Lint
        run: ruff check sprint1_v2/backend --ignore E501 || true
      - name: Syntax check
        run: python -m py_compile sprint1_v2/backend/main.py sprint1_v2/backend/config.py sprint1_v2/backend/database.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sprint1_v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sprint1_v2/frontend/package-lock.json
      - run: npm install
      - name: Type check
        run: npx tsc --noEmit || true
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_dummy
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
