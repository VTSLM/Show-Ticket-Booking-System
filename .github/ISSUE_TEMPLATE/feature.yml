name: Feature request
description: Suggest a new feature or an improvement
title: "feat: "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why? Describe the problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: Acceptance criteria as a checklist.
      placeholder: |
        - [ ] ...
        - [ ] Tests cover ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Alternatives considered, mock-ups, related issues.
