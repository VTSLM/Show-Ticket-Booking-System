version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/ticketflow-firebase.json
    volumes:
      - ./ticketflow-firebase.json:/app/ticketflow-firebase.json:ro
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    restart: unless-stopped
    depends_on:
      - backend
